<h4>Detalles de la factura</h4>
@if (item.length > 0) {
<table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>id</th>
            <th>product</th>
            <th>prices</th>
            <th>quantity</th>
        </tr>
    </thead>
    <tbody>
        @for (item of item; track $index) {
        <tr app-row-item [items]="item"></tr>
        }
    </tbody>
</table>
} @else {
    <div class="alert alert-warning">La tabla no tiene items</div>
}
